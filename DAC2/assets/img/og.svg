<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Accent slash -->
  <polygon points="900,0 1200,0 1100,630 800,630" fill="#C6FF00" opacity="0.2"/>
  
  <!-- Content -->
  <g text-anchor="middle">
    <!-- Wordmark -->
    <text x="600" y="200" font-size="120" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif" letter-spacing="-3">DAC</text>
    
    <!-- Accent line under DAC -->
    <line x1="400" y1="220" x2="800" y2="220" stroke="#C6FF00" stroke-width="4"/>
    
    <!-- Tagline -->
    <text x="600" y="320" font-size="48" fill="#C6FF00" font-family="Arial, sans-serif" font-weight="600">Detail. Protect. Perfect.</text>
    
    <!-- Description -->
    <text x="600" y="390" font-size="36" fill="#999999" font-family="Arial, sans-serif">Mobile detailing · Kleinburg</text>
  </g>
</svg>
